[build-system]
requires = [
    "setuptools>=70",
    "wheel"
]
build-backend = "setuptools.build_meta"

###############################################################################
# PROJECT
###############################################################################

[project]
name = "quantplatform"
version = "1.0.0"

description = """
Institutional Quantitative Trading Platform.
Research, Architecture Search, Walk Forward Optimization,
Model Validation, Portfolio Construction,
Execution and Production Monitoring under a single architecture.
"""

readme = "README.md"

requires-python = ">=3.11"

license = {text = "Proprietary"}

authors = [
    {name = "QuantPlatform"}
]

keywords = [
    "algorithmic-trading",
    "quantitative-finance",
    "research",
    "walk-forward",
    "optimization",
    "portfolio",
    "backtesting",
    "metaheuristics",
    "architecture-search",
    "trading"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
]

###############################################################################
# DEPENDENCIAS BASE
###############################################################################

dependencies = [

    ###########################################################################
    # NUMERICAL CORE
    ###########################################################################

    "numpy>=2.0,<3",
    "scipy>=1.14,<2",

    ###########################################################################
    # DATA INFRASTRUCTURE
    ###########################################################################

    "pandas>=2.2,<3",
    "pyarrow>=18",

    ###########################################################################
    # CONFIGURATION
    ###########################################################################

    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    ###########################################################################
    # LOGGING
    ###########################################################################

    "structlog>=24",

    ###########################################################################
    # SERIALIZATION
    ###########################################################################

    "orjson>=3.10",

    ###########################################################################
    # CLI
    ###########################################################################

    "typer>=0.15",

]

###############################################################################
# OPTIONAL DEPENDENCIES
###############################################################################

[project.optional-dependencies]

###############################################################################
# DEVELOPMENT
###############################################################################

dev = [

    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-xdist>=3",

    "mypy>=1.13",

    "ruff>=0.8",

    "pre-commit>=4",

]

###############################################################################
# WINDOWS MT5
###############################################################################

mt5 = [

    "MetaTrader5>=5.0.45"

]

###############################################################################
# VISUALIZATION
###############################################################################

viz = [

    "matplotlib>=3.10",

    "plotly>=6",

]

###############################################################################
# NOTEBOOKS
###############################################################################

research = [

    "jupyterlab>=4",

    "ipykernel>=6",

]

###############################################################################
# CLI
###############################################################################

[project.scripts]

qp = "app.interfaces.cli:main"

###############################################################################
# PACKAGE DISCOVERY
###############################################################################

[tool.setuptools.packages.find]

# Arbol congelado en el tag `architecture-baseline`: TODO el codigo importable
# cuelga de `app/`. No hay paquetes de primer nivel fuera de el.
#
#   app/core          primitivas, sin dependencias internas
#   app/domain        entidades, objetos de valor y servicios de dominio
#   app/shared        puertos (Protocol) entre dominio y mundo
#   app/application   runners: orquestacion, sin reglas
#   app/research      features, signals, strategies, backtest, data
#   app/discovery     generacion y mutacion de arquitecturas
#   app/optimization  busquedas
#   app/walkforward   particionado y agregacion de folds
#   app/validation    pruebas estadisticas
#   app/execution     maquina de estados de ordenes y ruteo
#   app/portfolio     riesgo y dimensionamiento por cartera
#   app/broker        adaptadores de broker
#   app/storage       zoo y repositorio de artefactos
#   app/monitoring    metricas de runtime y auditoria
#   app/analytics     calculo de metricas y reporting
#   app/paper         motor sobre feed en tiempo real, sin ejecucion
#   app/live          motor de ejecucion real
#   app/interfaces    CLI y API
#
# `configs`, `data`, `artifacts`, `experiments`, `docs`, `scripts` y `tests` no
# se listan: son directorios de datos, documentacion y pruebas, no paquetes.

include = [

    "app*",

]

###############################################################################
# PYTEST
###############################################################################

[tool.pytest.ini_options]

minversion = "8"

testpaths = [

    "tests"

]

addopts = """

-q

--strict-markers

--strict-config

"""

markers = [

    "unit",

    "integration",

    "contract",

    "golden",

    "research",

    "walkforward",

    "discovery",

    "performance",

    "slow",

]

###############################################################################
# MYPY
###############################################################################

[tool.mypy]

# 3.13 y no el 3.11 de `requires-python`, y el motivo es de HERRAMIENTA, no de
# compatibilidad del paquete.
#
# Los stubs de numpy 2.5 usan sintaxis PEP 695 -`type _Falsy = ...` en
# `numpy/__init__.pyi`-, que exige 3.12 o superior. Con `--python-version 3.11`
# mypy aborta al leer ese fichero antes de analizar una sola linea propia:
#
#     numpy/__init__.pyi:737: error: Type statement is only supported in
#     Python 3.12 and greater  [syntax]
#     Found 1 error in 1 file (errors prevented further checking)
#
# Fijar 3.11 aqui no daria un analisis mas estricto: daria NINGUN analisis. Las
# tres alternativas se descartaron por empeorar el resultado -clavar numpy a una
# version con stubs 3.11 constrine el nucleo numerico de una plataforma
# cuantitativa, y excluir numpy de mypy debilita el gate justo en la frontera
# numerica, que es donde mas se necesita-.
#
# `requires-python = ">=3.11"` NO se rebaja por esto. El codigo propio no usa
# sintaxis 3.12+ y los `.pyi` no se ejecutan nunca, asi que la limitacion es del
# analisis estatico y no de la ejecucion. Quien verifica la compatibilidad real
# es la matriz de `.github/workflows/ci.yml`, que corre `pytest` en 3.11, 3.12 y
# 3.13. Analisis estatico y compatibilidad de ejecucion se comprueban por vias
# distintas a proposito.
#
# Revisar cuando numpy publique stubs compatibles con 3.11, o cuando
# `requires-python` suba por una decision de producto.
python_version = "3.13"

strict = true

warn_unreachable = true

warn_unused_configs = true

disallow_any_generics = true

disallow_untyped_defs = true

disallow_incomplete_defs = true

check_untyped_defs = true

plugins = [

    "pydantic.mypy"

]

# `type-abstract` prohibe pasar una clase abstracta -o un Protocol- donde se
# espera `type[T]`. La regla existe para impedir que se instancie algo que no se
# puede instanciar, y aqui NADA se instancia: el contenedor usa el Protocol como
# CLAVE de su registro (`container.resolve(BrokerPort)`), nunca lo construye.
#
# Se desactiva globalmente y no con supresiones por linea porque el patron es la
# columna vertebral del sistema (ADR-0006) y reaparece en cada punto de registro
# de las fases 4 a 10. Cincuenta `# type: ignore` identicos no comunican nada y
# acaban copiandose a sitios donde si esconden un fallo real; una decision
# escrita una vez, si.
disable_error_code = [

    "type-abstract",

]

[[tool.mypy.overrides]]

module = [

    # Dependencias sin stubs. `MetaTrader5` y `structlog` entran en las fases 3 y
    # 10; `yaml` es un proveedor de configuracion opcional a proposito y por eso
    # nunca podra asumirse instalado.
    "MetaTrader5.*",

    "structlog.*",

    "yaml.*",

    # `pyarrow` no publica `py.typed` ni stubs. Entra con el adaptador de
    # historicos en Parquet, y solo se toca en la frontera: lo que cruza hacia
    # dentro son arrays de numpy tipados, nunca un objeto de pyarrow. La
    # supresion se limita por tanto al import y no debilita el analisis de nada
    # que viaje por el dominio.
    "pyarrow.*",

]

ignore_missing_imports = true

###############################################################################
# RUFF
###############################################################################

[tool.ruff]

line-length = 100

target-version = "py311"

[tool.ruff.lint]

select = [

    "E",

    "F",

    "I",

    "N",

    "UP",

    "B",

    "A",

    "C4",

    "SIM",

    "ARG",

    "PTH",

    "RUF",

]

# Toda supresion lleva su motivo (P9). Ninguna se anade sin decir por que, y el
# motivo remite al contrato que la gobierna cuando existe: la regla vive una vez.
ignore = [

    # Longitud de linea: la formatea `line-length = 100` de arriba. Duplicar la
    # comprobacion solo produce dos numeros que pueden discrepar.
    "E501",

    # Sufijo `Error` obligatorio en excepciones. Lo gobierna
    # `configs/conventions.toml` -> [naming].exception_suffix_required = false,
    # donde esta el razonamiento completo. Las excepciones de esta plataforma
    # nombran el hecho (`LookaheadDetected`), no la categoria.
    "N818",

    # `isinstance(x, (A, B))` -> `isinstance(x, A | B)`. Se rechaza por dos
    # motivos. Ruff retiro esta regla en 0.12 precisamente porque la forma con
    # union construye un objeto `types.UnionType` en cada llamada y es mas lenta
    # que la tupla, que se evalua una sola vez. Y el `isinstance` sobre tuplas
    # aparece en los recorridos de AST de la gobernanza y en la validacion de
    # `Bars`, que son rutas calientes. Adoptar hoy una regla que la herramienta
    # ya retiro seria reescribir codigo para volver a reescribirlo despues.
    "UP038",

]

[tool.ruff.lint.per-file-ignores]

"tests/*" = [

    "ARG"

]

###############################################################################
# ARCHITECTURAL PRINCIPLES
###############################################################################

[tool.quantplatform]

architecture = "clean"

dependency_rule = "outward_only"

source_of_truth = "docs"

configuration = "typed"

logging = "structured"

serialization = "orjson"

numerical_backend = "numpy"

data_backend = "pandas"

research_engine = "deterministic"

execution_engine = "event-driven"

validation_engine = "walk-forward"

optimization_engine = "architecture-search"

risk_engine = "portfolio-aware"

broker_layer = "adapter"

storage = "repository"

testing = "contract-first"

reproducibility = true

deterministic_random_seed = true

fail_fast = true

###############################################################################
# END
###############################################################################